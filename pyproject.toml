[project]
name = "nlp"
version = "0.1.0"
description = "GPT-2-style decoder-only Transformer trained from scratch to generate cooking recipes, with a custom BPE tokenizer and MLflow experiment tracking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.9.0",
    "cmsketch>=0.1.11",
    "kagglehub[pandas-datasets]>=0.3.13",
    "matplotlib>=3.10.6",
    "mlflow>=3.6.0",
    "pandas>=2.3.3",
    "regex>=2025.9.18",
    "tokenizers>=0.22.1",
    "torch>=2.9.0",
    "torchinfo>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# the pipeline stages are top-level packages, not an installed distribution
pythonpath = ["."]
testpaths = ["tests"]
